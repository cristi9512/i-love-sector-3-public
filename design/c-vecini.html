<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vecinii din S3 · Varianta C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #fff8ef; --card: #ffffff; --soft: #fff1e0; --line: #f0e2cf; --ink: #2b2733; --ink-2: #6b6475;
  --coral: #ff6a4d; --sun: #ffc23d; --mint: #2fb383; --sky: #4c7dff; --plum: #8a5cf6; --rose: #e5484d;
  --open: #e08a00; --good: #23a06f; --partial: #4c7dff; --bad: #e5484d; --other: #8a5cf6;
  --head: 'Bricolage Grotesque', system-ui, sans-serif; --body: 'Nunito', system-ui, sans-serif;
  --r: 22px; --shadow: 0 2px 0 rgba(43,39,51,.06), 0 8px 24px rgba(120,80,30,.08);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.ic { flex: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px; }

header.app { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; }
.logo { display: flex; align-items: center; gap: 10px; font: 800 22px var(--head); letter-spacing: -.01em; white-space: nowrap; }
.logo i { width: 40px; height: 40px; border-radius: 14px 14px 14px 4px; background: var(--coral); display: grid; place-items: center; color: #fff; transform: rotate(-6deg); }
.cta { display: inline-flex; gap: 8px; align-items: center; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 800; text-decoration: none; font-size: 15px; }
.cta:hover { background: var(--coral); }

.hello { padding: 18px 0 8px; }
.hello h1 { font: 800 clamp(34px, 6vw, 56px)/1.02 var(--head); letter-spacing: -.025em; margin: 0; }
.hello h1 span { color: var(--coral); }
.hello p { font-size: 19px; color: var(--ink-2); margin: 10px 0 0; max-width: 640px; }

.madlib { margin: 22px 0 8px; background: var(--card); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); font: 600 21px/2.1 var(--head); }
.madlib select { appearance: none; border: 0; border-radius: 999px; padding: 2px 34px 2px 14px; margin: 0 2px; font: 700 18px var(--body); background: var(--soft) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%232b2733" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>') no-repeat right 12px center; cursor: pointer; color: var(--ink); }
.madlib select:focus-visible { outline: 3px solid var(--sky); }
.madlib .q { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 999px; padding: 0 12px; margin-left: 2px; }
.madlib .q input { border: 0; background: transparent; outline: 0; font: 700 17px var(--body); width: 170px; }

.layout { display: grid; grid-template-columns: 1fr 360px; gap: 26px; padding: 18px 0 50px; align-items: start; }
.side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }

.tiles { display: grid; grid-template-columns: 1fr; gap: 12px; }
.tile { background: var(--card); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: flex; gap: 16px; align-items: center; }
.tile b { display: block; font: 800 28px/1 var(--head); }
.tile span { color: var(--ink-2); font-size: 15px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--soft); }
.ring text { font: 800 15px var(--head); fill: var(--ink); }
.place { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.place .mini { height: 170px; }
.place .txt { padding: 14px 18px 18px; }
.place .tag { display: inline-flex; gap: 6px; align-items: center; background: var(--sun); color: var(--ink); border-radius: 999px; padding: 3px 11px; font-weight: 800; font-size: 13px; }
.place h3 { font: 800 21px/1.2 var(--head); margin: 8px 0 4px; }
.place p { margin: 0; color: var(--ink-2); font-size: 15px; }
.place button { margin-top: 12px; border: 0; background: var(--soft); border-radius: 999px; padding: 8px 14px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }

/* conversation cards */
.feed { display: flex; flex-direction: column; gap: 16px; }
.convo { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px 14px; cursor: pointer; transition: transform .12s; }
.convo:hover { transform: translateY(-2px); }
.convo-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.topic { display: inline-flex; gap: 8px; align-items: center; font-weight: 800; font-size: 14.5px; }
.topic i { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, white); color: var(--c); }
.convo-top time { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.msg { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
.msg.city { flex-direction: row-reverse; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--ink); }
.city .avatar { background: var(--ink); color: #fff; }
.bubble { background: var(--soft); border-radius: 18px 18px 18px 6px; padding: 10px 14px; max-width: 85%; }
.city .bubble { background: color-mix(in srgb, var(--c) 13%, white); border-radius: 18px 18px 6px 18px; }
.bubble small { display: block; font-weight: 800; font-size: 12.5px; color: var(--ink-2); margin-bottom: 2px; }
.bubble p { margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.city .bubble p { -webkit-line-clamp: 3; }
.waiting .bubble { background: transparent; border: 2px dashed var(--line); color: var(--ink-2); }
.typing { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: t 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes t { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } .convo { transition: none; } }
.trackline { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1.5px dashed var(--line); font-size: 14px; flex-wrap: wrap; }
.dots { display: flex; align-items: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--c); }
.dots b { width: 22px; height: 3px; background: var(--line); }
.dots b.on { background: var(--c); }
.trackline strong { color: var(--c); }
.took { margin-left: auto; background: var(--soft); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.more { align-self: center; border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 12px 22px; font-weight: 800; }
.more:hover { background: var(--ink); color: #fff; }
.none { text-align: center; padding: 40px; background: var(--card); border-radius: var(--r); font: 700 20px var(--head); }

/* thread view */
.sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(43,39,51,.45); display: flex; justify-content: center; align-items: flex-end; }
.thread { background: var(--bg); width: min(720px, 100%); max-height: 94vh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 18px 20px 30px; }
@media (min-width: 760px) { .sheet { align-items: center; } .thread { border-radius: 28px; } }
.thread-top { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -18px; background: var(--bg); padding: 6px 0 10px; z-index: 2; }
.x { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; }
.thread h2 { font: 800 28px/1.15 var(--head); letter-spacing: -.02em; margin: 6px 0 12px; }
.bigtrack { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: var(--r); padding: 16px 10px; box-shadow: var(--shadow); margin-bottom: 18px; text-align: center; font-size: 14px; position: relative; }
.bigtrack div i { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; background: var(--soft); color: var(--ink-2); }
.bigtrack div.on i { background: var(--c); color: #fff; }
.bigtrack div.on { font-weight: 800; }
.bigtrack small { display: block; color: var(--ink-2); font-weight: 400; }
.thread .bubble p { -webkit-line-clamp: unset; display: block; white-space: pre-line; }
.sys { text-align: center; color: var(--ink-2); font-size: 13.5px; margin: 6px 0 12px; }
.sys span { background: var(--soft); border-radius: 999px; padding: 3px 12px; }
.thread .mini { height: 190px; border-radius: var(--r); overflow: hidden; margin: 16px 0 10px; box-shadow: var(--shadow); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.acts a, .acts button { display: inline-flex; gap: 8px; align-items: center; border: 0; border-radius: 999px; padding: 11px 16px; font-weight: 800; text-decoration: none; background: var(--card); box-shadow: var(--shadow); font-size: 15px; }
.acts .main { background: var(--coral); color: #fff; }
.others h3 { font: 800 18px var(--head); margin: 22px 0 8px; }
.others button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; background: var(--card); border: 0; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.others span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer.f { text-align: center; color: var(--ink-2); font-size: 14px; padding: 10px 0 40px; }

@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .tiles { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { flex-direction: column; text-align: center; gap: 6px; padding: 12px 8px; }
  .tile b { font-size: 21px; }
  .tile span { font-size: 13px; }
  .ring { width: 48px; height: 48px; }
  .side .place { display: none; }
  .cta .long { display: none; }
  .madlib { font-size: 18px; line-height: 2.2; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="logo"><i id="logoIc"></i>Vecinii din S3</div>
    <a class="cta" href="https://iloves3.primarie3.ro/citycareweb/" target="_blank" rel="noopener"><span id="ctaIc"></span><span>Semnalează<span class="long"> o problemă</span></span></a>
  </header>

  <section class="hello">
    <h1 id="greet"></h1>
    <p>Iată ce au semnalat vecinii din Sectorul 3 în ultimele 7 zile și ce le-a răspuns primăria.</p>
  </section>

  <div class="madlib" role="group" aria-label="Filtre">
    Arată-mi <select id="fStatus" aria-label="Ce sesizări">
      <option value="all">toate sesizările</option><option value="open">sesizările în lucru</option>
      <option value="done">sesizările rezolvate</option><option value="bad">sesizările nerezolvate</option><option value="reply">doar cele cu răspuns</option>
    </select>
    despre <select id="fGroup" aria-label="Subiect"></select>
    din <select id="fArea" aria-label="Cartier"></select>
    <span class="q"><span id="qIc"></span><input id="q" type="search" placeholder="sau caută ceva…" aria-label="Caută"></span>
  </div>

  <div class="layout">
    <main class="feed" id="feed"></main>
    <aside class="side">
      <div class="tiles" id="tiles"></div>
      <div class="place" id="place"></div>
    </aside>
  </div>
  <footer class="f">Neoficial · date publice de la Primăria Sectorului 3, arhivate orar · Varianta C · <a href="./">vezi celelalte variante</a></footer>
</div>
<div class="sheet" id="sheet" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { GROUPS, icon, esc, ago, fmtDate, took, n, loadData, hotspots, median, OFFICIAL, osmTiles, distanceM } from './shared.js';

const $ = (s) => document.querySelector(s);
const state = { status: 'all', group: '', area: '', q: '', shown: 12 };
const C = (k) => `var(--${k})`;
const LABEL = { open: 'În lucru', good: 'Rezolvată', partial: 'Rezolvată parțial', bad: 'Nerezolvată', other: 'Închisă' };
let data, placeMap;

$('#logoIc').innerHTML = icon('home', 22);
$('#ctaIc').innerHTML = icon('plus', 18);
$('#qIc').innerHTML = icon('search', 18);
const h = +new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Europe/Bucharest' }).format(new Date());
$('#greet').innerHTML = `${h < 11 ? 'Bună dimineața' : h < 18 ? 'Bună ziua' : 'Bună seara'}, <span>vecine!</span>`;

const fold = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function list() {
  const q = fold(state.q);
  return data.items.filter((it) =>
    (!state.group || it.group.key === state.group) && (!state.area || it.area === state.area) &&
    (state.status === 'all' || (state.status === 'open' && it.status.key === 'open') || (state.status === 'done' && (it.status.key === 'good' || it.status.key === 'partial')) ||
      (state.status === 'bad' && it.status.key === 'bad') || (state.status === 'reply' && it.reply)) &&
    (!q || fold(it.desc + ' ' + it.reply + ' ' + it.ticket + ' ' + it.area).includes(q)));
}

function track(it) {
  const s = it.status.step;
  return `<span class="dots"><i class="on"></i><b class="${s >= 2 ? 'on' : ''}"></b><i class="${s >= 2 ? 'on' : ''}"></i><b class="${s >= 3 ? 'on' : ''}"></b><i class="${s >= 3 ? 'on' : ''}"></i></span>`;
}
function convo(it) {
  const city = it.reply
    ? `<div class="msg city"><span class="avatar">${icon('hall', 18)}</span><div class="bubble"><small>Primăria Sectorului 3</small><p>${esc(it.reply)}</p></div></div>`
    : it.status.key === 'open'
      ? `<div class="msg city waiting"><span class="avatar">${icon('hall', 18)}</span><div class="bubble">Primăria încă lucrează la asta<span class="typing"><i></i><i></i><i></i></span></div></div>`
      : `<div class="msg city waiting"><span class="avatar">${icon('hall', 18)}</span><div class="bubble">Închisă fără un răspuns scris.</div></div>`;
  return `<article class="convo" data-id="${it.id}" style="--c:${C(it.status.key)}">
    <div class="convo-top"><span class="topic"><i>${icon(it.group.icon, 18)}</i>${esc(it.group.name)} · ${esc(it.area || '')}</span><time>${ago(it.created)}</time></div>
    <div class="msg"><span class="avatar">${icon('home', 18)}</span><div class="bubble"><small>Un vecin din ${esc(it.area || 'Sectorul 3')}</small><p>${esc(it.desc)}</p></div></div>
    ${city}
    <div class="trackline">${track(it)}<strong>${LABEL[it.status.key]}</strong>${it.closedAt ? `<span class="took">${icon('clock', 14)} în ${took(it.closedAt - it.created)}</span>` : it.status.key === 'open' ? `<span class="took">${icon('clock', 14)} așteaptă de ${took(Date.now() - it.created)}</span>` : ''}</div>
  </article>`;
}

function ring(pct, color, label) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${label}"><circle class="bg" cx="32" cy="32" r="${r}"/><circle cx="32" cy="32" r="${r}" stroke="${color}" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle">${Math.round(pct * 100)}%</text></svg>`;
}

function render() {
  const l = list();
  const done = l.filter((x) => x.status.key === 'good' || x.status.key === 'partial').length;
  const open = l.filter((x) => x.status.key === 'open').length;
  const ttc = median(l.filter((x) => x.closedAt).map((x) => x.closedAt - x.created));
  $('#tiles').innerHTML = `
    <div class="tile">${ring(l.length ? done / l.length : 0, 'var(--good)', 'rezolvate')}<div><b>${n(l.length)}</b><span>sesizări, ${n(done)} rezolvate</span></div></div>
    <div class="tile">${ring(l.length ? open / l.length : 0, 'var(--open)', 'în lucru')}<div><b>${n(open)}</b><span>încă în lucru</span></div></div>
    <div class="tile"><svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><g transform="translate(14 14) scale(1.5)" stroke="var(--sky)" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g></svg><div><b>${ttc ? took(ttc) : '—'}</b><span>de obicei, până la rezolvare</span></div></div>`;

  const spot = hotspots(l)[0];
  if (spot) {
    $('#place').innerHTML = `<div class="mini" id="placeMap"></div><div class="txt"><span class="tag">${icon('repeat', 14)} Locul săptămânii</span>
      <h3>${esc(spot.group.name)} în ${esc(spot.area || 'sector')}</h3><p>${n(spot.n)} vecini au semnalat aceeași problemă în același loc. ${spot.open ? `${n(spot.open)} sunt încă în lucru.` : 'Toate au fost închise.'}</p>
      <button data-spot="1">${icon('chat', 16)} Vezi ce au scris</button></div>`;
    placeMap?.remove();
    placeMap = L.map('placeMap', { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false }).setView([spot.lat, spot.lng], 17);
    osmTiles().addTo(placeMap);
    spot.items.forEach((x) => L.circleMarker([x.lat, x.lng], { radius: 7, weight: 2, color: '#fff', fillColor: '#ff6a4d', fillOpacity: 1 }).addTo(placeMap));
    render.spot = spot;
  } else $('#place').innerHTML = '';

  $('#feed').innerHTML = l.length ? l.slice(0, state.shown).map(convo).join('') + (l.length > state.shown ? `<button class="more" id="more">Arată încă ${n(Math.min(12, l.length - state.shown))} din ${n(l.length - state.shown)}</button>` : '')
    : '<div class="none">Nicio sesizare pentru alegerea asta. Încearcă altceva!</div>';
}

function openThread(id) {
  const it = data.items.find((x) => x.id === id);
  if (!it) return;
  const s = it.status.step;
  const sys = [];
  for (const [at, kind, val] of it.history) {
    if (kind === 's') sys.push([new Date(at), `Starea s-a schimbat în „${LABEL[it.status.key]}”`]);
    if (kind === 'd') sys.push([new Date(at), 'Primăria a editat descrierea (date personale ascunse)']);
  }
  const others = data.items.filter((x) => x !== it && distanceM(x, it) < 80).slice(0, 4);
  $('#sheet').innerHTML = `<div class="thread" role="dialog" aria-modal="true" style="--c:${C(it.status.key)}">
    <div class="thread-top"><span class="topic"><i>${icon(it.group.icon, 18)}</i>${esc(it.group.name)} · ${esc(it.area || '')}</span><button class="x" id="x" aria-label="Închide">${icon('close', 20)}</button></div>
    <h2>${esc(it.title)}</h2>
    <div class="bigtrack">
      <div class="on"><i>${icon('chat', 18)}</i>Trimisă<small>${fmtDate(it.created, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></div>
      <div class="${s >= 2 ? 'on' : ''}"><i>${icon('clock', 18)}</i>În lucru<small>${s >= 2 ? 'preluată' : 'în curând'}</small></div>
      <div class="${s >= 3 ? 'on' : ''}"><i>${icon(s >= 3 ? 'check' : 'dots', 18)}</i>${s >= 3 ? LABEL[it.status.key] : 'Rezolvare'}<small>${it.closedAt ? 'în ' + took(it.closedAt - it.created) : s >= 3 ? 'închisă' : 'așteptăm'}</small></div>
    </div>
    <div class="sys"><span>${fmtDate(it.created)}</span></div>
    <div class="msg"><span class="avatar">${icon('home', 18)}</span><div class="bubble"><small>Un vecin din ${esc(it.area || 'Sectorul 3')}</small><p>${esc(it.desc)}</p></div></div>
    ${sys.map(([d, t]) => `<div class="sys"><span>${fmtDate(d, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · ${esc(t)}</span></div>`).join('')}
    ${it.reply ? `<div class="msg city"><span class="avatar">${icon('hall', 18)}</span><div class="bubble"><small>Primăria Sectorului 3</small><p>${esc(it.reply)}</p></div></div>`
      : `<div class="msg city waiting"><span class="avatar">${icon('hall', 18)}</span><div class="bubble">${it.status.key === 'open' ? 'Primăria încă lucrează la asta<span class="typing"><i></i><i></i><i></i></span>' : 'Închisă fără un răspuns scris.'}</div></div>`}
    <div class="mini" id="tmap"></div>
    <div class="acts">
      <a class="main" href="${OFFICIAL}?lat=${it.lat}&lng=${it.lng}&zoom=18" target="_blank" rel="noopener">${icon('plus', 18)} Am și eu o problemă aici</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${it.lat},${it.lng}" target="_blank" rel="noopener">${icon('pin', 18)} Pe hartă</a>
      <button id="share">${icon('share', 18)} Trimite unui vecin</button>
    </div>
    ${others.length ? `<div class="others"><h3>Și alți vecini au scris despre locul ăsta</h3>${others.map((o) => `<button data-id="${o.id}" style="--c:${C(o.status.key)}"><span class="topic"><i>${icon(o.group.icon, 16)}</i></span><span>${esc(o.title)}</span><small>${ago(o.created)}</small></button>`).join('')}</div>` : ''}
    <p class="sys"><span>Sesizarea ${esc(it.ticket)}</span></p>
  </div>`;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  const m = L.map('tmap', { zoomControl: false, attributionControl: false, scrollWheelZoom: false }).setView([it.lat, it.lng], 17);
  osmTiles().addTo(m);
  L.circleMarker([it.lat, it.lng], { radius: 10, weight: 3, color: '#fff', fillColor: '#ff6a4d', fillOpacity: 1 }).addTo(m);
  $('#x').onclick = closeThread;
  $('#share').onclick = () => { navigator.clipboard?.writeText(location.href.split('#')[0] + '#' + it.ticket); $('#share').innerHTML = icon('check', 18) + ' Link copiat'; };
}
function closeThread() { $('#sheet').hidden = true; document.body.style.overflow = ''; }

document.addEventListener('click', (e) => {
  if (e.target.id === 'sheet') return closeThread();
  if (e.target.closest('#more')) { state.shown += 12; return render(); }
  if (e.target.closest('[data-spot]') && render.spot) { $('#feed').innerHTML = render.spot.items.map(convo).join('') + '<button class="more" id="back">← Înapoi la toate</button>'; $('#feed').scrollIntoView({ behavior: 'smooth' }); return; }
  if (e.target.closest('#back')) return render();
  const c = e.target.closest('[data-id]'); if (c) return openThread(c.dataset.id);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeThread(); });
for (const [id, key] of [['fStatus', 'status'], ['fGroup', 'group'], ['fArea', 'area']]) $('#' + id).addEventListener('change', (e) => { state[key] = e.target.value; state.shown = 12; render(); });
let qt; $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); state.shown = 12; render(); }, 250); });

data = await loadData(7);
$('#fGroup').innerHTML = '<option value="">orice subiect</option>' + GROUPS.map((g) => `<option value="${g.key}">${esc(g.name.toLowerCase())}</option>`).join('');
$('#fArea').innerHTML = '<option value="">tot sectorul</option>' + data.assets.areas.map((a) => a.name).sort((a, b) => a.localeCompare(b, 'ro')).map((a) => `<option>${esc(a)}</option>`).join('');
render();
</script>
</body>
</html>
