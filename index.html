<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesizări Sector 3</title>
  <meta name="description" content="Toate sesizările publice din Sectorul 3, cu descrierea completă și răspunsul primăriei.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </span>
      <div>
        <h1>Sesizări Sector 3</h1>
        <p class="brand-sub">Ce raportează vecinii tăi și ce răspunde primăria</p>
      </div>
    </div>
    <a class="btn btn-primary" href="https://iloves3.primarie3.ro/citycareweb/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <span>Trimite o sesizare</span>
    </a>
  </header>

  <section class="filters" aria-label="Filtre">
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.87 10.59l4.77 4.77 1.41-1.41-4.77-4.77A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="q" type="search" placeholder="Caută în descrieri, răspunsuri, nr. sesizare (ex. CAS-0274369)…" autocomplete="off">
    </div>

    <div class="filter-row">
      <div class="seg" id="range" role="radiogroup" aria-label="Perioadă">
        <button data-days="1" role="radio">24h</button>
        <button data-days="7" role="radio">7 zile</button>
        <button data-days="30" role="radio">30 zile</button>
        <button data-days="90" role="radio">3 luni</button>
        <button data-days="custom" role="radio">Interval…</button>
      </div>
      <div class="custom-range" id="customRange" hidden>
        <input type="date" id="from" aria-label="De la">
        <span>–</span>
        <input type="date" id="to" aria-label="Până la">
        <button class="btn btn-ghost" id="applyRange">Aplică</button>
      </div>

      <div class="seg" id="status" role="radiogroup" aria-label="Stare">
        <button data-status="all" role="radio">Toate</button>
        <button data-status="open" role="radio"><i class="dot s-open"></i>În lucru</button>
        <button data-status="good" role="radio"><i class="dot s-good"></i>Rezolvate</button>
        <button data-status="bad" role="radio"><i class="dot s-bad"></i>Nefavorabil</button>
        <button data-status="other" role="radio"><i class="dot s-other"></i>Altele</button>
      </div>

      <div class="dropdown" id="catDropdown">
        <button class="btn btn-outline" id="catBtn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 5h18v2H3zm3 6h12v2H6zm3 6h6v2H9z"/></svg>
          <span id="catLabel">Toate categoriile</span>
        </button>
        <div class="dropdown-panel" id="catPanel" hidden>
          <div class="dropdown-head">
            <button class="link" id="catAll">Toate</button>
            <button class="link" id="catNone">Niciuna</button>
          </div>
          <div id="catList" class="cat-list"></div>
        </div>
      </div>

      <label class="toggle">
        <input type="checkbox" id="hideParking">
        <span>Ascunde parcările</span>
      </label>
    </div>
  </section>

  <section class="stats" id="stats" aria-live="polite"></section>

  <main class="layout" id="layout">
    <section class="list-pane" aria-label="Listă sesizări">
      <div class="list-head">
        <span id="resultCount">Se încarcă…</span>
        <select id="sort" aria-label="Sortare">
          <option value="new">Cele mai noi</option>
          <option value="old">Cele mai vechi</option>
          <option value="long">Descrieri lungi</option>
        </select>
      </div>
      <div id="progress" class="progress" hidden><div class="progress-bar"></div></div>
      <div id="list" class="list"></div>
      <div id="listFooter" class="list-footer"></div>
    </section>
    <section class="map-pane" aria-label="Hartă">
      <div id="map"></div>
      <div class="legend">
        <span><i class="dot s-open"></i>În lucru</span>
        <span><i class="dot s-good"></i>Rezolvată</span>
        <span><i class="dot s-partial"></i>Parțial</span>
        <span><i class="dot s-bad"></i>Nefavorabil</span>
        <span><i class="dot s-other"></i>Altele</span>
      </div>
    </section>
  </main>

  <button class="view-toggle" id="viewToggle" aria-label="Comută listă / hartă">
    <span class="when-list">🗺️ Hartă</span><span class="when-map">📋 Listă</span>
  </button>

  <dialog id="detail" class="detail">
    <form method="dialog" class="detail-close"><button aria-label="Închide">✕</button></form>
    <div id="detailBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="foot">
    Date preluate în timp real din serviciul public CityCare al Primăriei Sectorului 3. Proiect neoficial.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
